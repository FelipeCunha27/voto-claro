{% extends 'base.html' %}

{% block title %}Sinalizar Problema - {{ bill.title }}{% endblock %}

{% block content %}
<a href="{% url 'panel_detail' bill.slug %}">&laquo; Voltar para o projeto</a>
    <h1>Sinalizar Problema</h1>
    <p>Projeto: {{ bill.title }}</p>

    {% if form.errors %}
    <div style="color: red; border: 1px solid red; padding: 10px; margin-bottom: 15px;">
        Corrija os erros abaixo.
    </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Enviar Sinalização</button>
    </form>
{% endblock %}
