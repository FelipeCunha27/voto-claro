{% extends 'base.html' %}

{% block title %}Registrar - Voto Claro{% endblock %}

{% block content %}
<h2>Registrar</h2>
    <form method="post" action="{% url 'registrar' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Criar conta</button>
    </form>
    <p>Já possui conta? <a href="{% url 'login' %}">Entrar</a></p>
{% endblock %}
