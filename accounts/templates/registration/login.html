{% extends 'base.html' %}

{% block title %}Entrar - Voto Claro{% endblock %}

{% block content %}
<h2>Entrar</h2>
    {% if form.errors %}
        <p>Por favor, entre com um usuário e senha corretos.</p>
    {% endif %}

    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Entrar</button>
    </form>
    <p>Não tem uma conta? <a href="{% url 'registrar' %}">Registre-se</a></p>
{% endblock %}
