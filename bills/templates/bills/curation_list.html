{% extends 'base.html' %}
{% block content %}
    <h2>Fila de Curadoria</h2>
    <ul>
    {% for version in versions %}
        <li>
            <a href="{% url 'curation_detail' version.pk %}">{{ version.bill.title }} - {{ version.summary|truncatechars:50 }}</a>
        </li>
    {% empty %}
        <li>Nenhum projeto pendente de revisão.</li>
    {% endfor %}
    </ul>
    <p><a href="{% url 'minhas_submissoes' %}">Voltar para Minhas Submissões</a></p>
{% endblock %}
