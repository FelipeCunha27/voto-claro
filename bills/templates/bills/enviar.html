{% extends 'base.html' %}

{% block title %}Enviar Projeto Político - Voto Claro{% endblock %}

{% block content %}
<h1>Enviar Projeto Político</h1>
    <p>Faça o upload do arquivo PDF, cole o texto ou insira o link oficial do projeto.</p>
    
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Enviar para a Inteligência Artificial</button>
    </form>
    
    <hr>
    <a href="{% url 'minhas_submissoes' %}">Voltar para Minhas Submissões</a>
{% endblock %}
