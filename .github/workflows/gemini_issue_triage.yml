name: Triage de Issues & Story Points (Aula 05)

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  gemini-issue-triage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout das Regras do Projeto
        uses: actions/checkout@v4

      - name: Instalar SDK do Gemini
        run: pip install google-genai

      - name: Scrum Master Issue Analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python scripts/github_review.py
          
      - name: Postar Triagem na Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('issue_report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "👔 **Gemini Scrum Master (Aula 05)**\n\n" + report
            });
