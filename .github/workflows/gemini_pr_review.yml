name: PR Review & Changelog (Aula 04)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  gemini-pr-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout das Regras do Projeto
        uses: actions/checkout@v4

      - name: Extrair Diff do Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} --repo ${{ github.repository }} > pr_diff.txt

      - name: Instalar SDK do Gemini
        run: pip install google-genai

      - name: Tech Lead Review & Changelog Generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/github_review.py
          
      - name: Postar Code Review Automático
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('review_report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "🤖 **Gemini PR Automático (Aula 04)**\n\n" + report
            });
